[package]
name = "praxis"
version = "0.1.0"
description = "Praxis — constructs interactive, gated notebook tutorials for any subject."
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri wants the app logic in a lib so mobile targets can link against it;
# src/main.rs is a thin desktop entry point over `praxis_lib::run()`.
name = "praxis_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
