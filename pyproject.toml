[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis"
version = "0.1.0"
description = "Praxis — constructs interactive, gated notebook tutorials for any subject."
requires-python = ">=3.10"
dependencies = [
    "nbformat>=5.9",
    "nbgrader==0.9.5",
    # The S3 client behind the `cloud` backend (praxis/s3.py). Core, not an extra:
    # `cloud` is selectable in the core app, so a missing client is a broken backend
    # rather than a skipped feature. Ceiling because praxis/s3.py pages through
    # `Minio._list_objects` for `max_keys`, which a major bump may move.
    "minio>=7.2,<8",
    # The retry policy around praxis/llm.py's one network seam. Core for the same
    # reason: every band that reaches a model goes through `complete()`, so without it
    # a rate limit is a failed notebook rather than a wait. Apache-2.0, no runtime
    # dependencies of its own, and its floor (3.9) is under praxis's.
    "tenacity>=9.0,<10",
]

[project.optional-dependencies]
# The launcher UI + live notebooks. Kept optional so the core (curriculum,
# scaffolder, gate) stays dependency-light.
launch = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "jupyterlab>=4.0",
    "nbconvert>=7.0",
]
dev = [
    "pytest>=8.0",
    # fastapi's TestClient (tests/test_launcher_api.py) needs it. It arrives with the
    # launch extra too — via jupyterlab — but the launcher gate should not depend on
    # another package's dependency list to keep working in CI.
    "httpx>=0.23,<1",
]

[project.scripts]
praxis-launch = "launcher.app:main"
praxis-lab = "launcher.app:launch_lab"

[tool.setuptools]
# This is a notebook library, not an importable package tree; ship the helper
# modules as top-level modules and the launcher package.
py-modules = ["curriculum", "scaffold_notebooks", "nbstatus"]
packages = ["launcher", "praxis"]

[tool.setuptools.package-data]
# The pinned Pyodide package index praxis/lite.py resolves a tutorial's imports
# against (docs/reference/jupyterlite.md). Vendored, so a build never asks the
# network what "available in the browser" means.
praxis = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
