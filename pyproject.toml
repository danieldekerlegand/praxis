[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis"
version = "0.1.0"
description = "Praxis — constructs interactive, gated notebook tutorials for any subject."
requires-python = ">=3.10"
dependencies = [
    "nbformat>=5.9",
]

[project.optional-dependencies]
# The launcher UI + live notebooks. Kept optional so the core (curriculum,
# scaffolder, Ralph generators) stays dependency-light.
launch = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "jupyterlab>=4.0",
    "nbconvert>=7.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
praxis-launch = "launcher.app:main"
praxis-lab = "launcher.app:launch_lab"

[tool.setuptools]
# This is a notebook library, not an importable package tree; ship the helper
# modules as top-level modules and the launcher package.
py-modules = ["curriculum", "scaffold_notebooks", "nbstatus"]
packages = ["launcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
