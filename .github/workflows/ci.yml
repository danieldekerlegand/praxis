# The merge gate, in CI. This mirrors `.chief/verify.sh` — same checks, same path-scoping,
# same order (the frontend builds before the Rust job's cargo build, because src-tauri
# embeds ui/dist at compile time and a missing dist silently becomes a placeholder page).
# Keep the two in sync: verify.sh is what agents run locally.
#
# Six checks as of 2026-09-03, and the reader-facing list is README.md's "The gate"
# section — the one home, so it cannot drift a fourth time. This header said "same three
# checks" until 2026-09-03, which had been wrong since validate_nbgrader.py and
# praxis.gatefloor were added and doubly so once the two doc gates below landed.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Which gates does this change need? Same predicates as verify.sh, computed once.
  # A push or a manual run answers "all of them" — there is no base to diff against.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.scope.outputs.ui }}
      rust: ${{ steps.scope.outputs.rust }}
      python: ${{ steps.scope.outputs.python }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed="$(git diff --name-only '${{ github.event.pull_request.base.sha }}...HEAD')"
          else
            changed="$(git ls-files)"
          fi
          echo "$changed" | head -50
          has() { echo "$changed" | grep -qE "$1" && echo true || echo false; }
          {
            echo "ui=$(has '^ui/')"
            echo "rust=$(has '^src-tauri/')"
            echo "python=$(has '\.(py|ipynb)$|^notebooks/|^tests/|^scripts/|^pyproject\.toml$|^ui/package\.json$|^src-tauri/tauri\.conf\.json$|^Makefile$|^README\.md$|^docs/reference/gate-authority\.md$')"
            echo "docs=$(has '\.md$|^docs/')"
          } >> "$GITHUB_OUTPUT"

  # Documentation gates — the pair verify.sh runs, mirrored here. CI carried NEITHER of
  # them until 2026-09-03, which is exactly the drift the "change one and change the
  # other" rule exists to stop: verify.sh blocked a doc regression locally and a PR that
  # never ran verify.sh merged it anyway.
  #
  # check-doc-links is a RATCHET against the PR base (pre-existing rot is retired
  # deliberately, never in one forced sweep); check-docs-structure is a WALL, because the
  # tree was brought fully compliant on 2026-09-03 and has no rot left to grandfather.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: doc links (ratchet vs base)
        run: |
          base="${{ github.event.pull_request.base.sha || 'HEAD' }}"
          node scripts/check-doc-links.mjs --ratchet --base "$base"
      - run: node scripts/check-docs-structure.mjs

  frontend:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui

  # Tauri backend. Builds the frontend first so cargo embeds the real bundle rather
  # than build.rs's placeholder — the same reason verify.sh orders them this way.
  shell:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview deps (tauri v2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci && npm run build
        working-directory: ui
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo build --quiet
        working-directory: src-tauri

  # Notebook core + the completion gate. The launch extra is installed so the launcher
  # API tests actually run instead of skipping themselves.
  #
  # This is also the release-version gate: tests/test_packaging.py asserts the version is
  # in step across tauri.conf.json, pyproject.toml and ui/package.json, and fails naming
  # the files that disagree. That is why the predicate above scopes those three manifests
  # (and scripts/) into this job rather than adding a fourth one.
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # nbgrader arrives with the core deps (it is pinned in [project].dependencies, not an
      # extra), which is what makes the validate step below runnable. verify.sh probes for the
      # same three imports locally and repairs a stale .venv rather than skipping the gate.
      - run: pip install -e '.[launch,dev]'
      - run: python scripts/validate_nbgrader.py notebooks
      # The coverage ratchet — see the same step in .chief/verify.sh. Fails only when gate
      # coverage drops below notebooks/coverage-floor.json, or when README.md's stated
      # figure disagrees with it. That is why README.md is in this job's path predicate.
      - run: python -m praxis.gatefloor
      - run: python -m pytest -q tests/

  # macOS bundle, on demand. Not a PR gate: it is the release build, and it is the same
  # command documented in docs/reference/packaging.md.
  #
  # Signing and notarization come entirely from the secrets below. An unset secret is an
  # empty environment variable, which is exactly the "no credentials" case — so a fork,
  # or a repo that has not configured them, still gets today's unsigned bundle instead of
  # a failed job. scripts/bundle-macos.sh reports which of the two it is taking, and
  # refuses a half-configured one — or a version that is not in step across the three
  # manifests — before spending the build.
  bundle-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: ./scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: praxis-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
